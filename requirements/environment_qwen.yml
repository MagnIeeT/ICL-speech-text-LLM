name: qwen
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # --- THE ENGINE (GPU Safe) ---
  - python=3.10
  - pytorch==2.1.2
  - torchvision==0.16.2
  - torchaudio==2.1.2
  - pytorch-cuda=11.8
  - ffmpeg                   # Required for audio processing

  # --- AI TOOLS (Conda Versions) ---
  - transformers>=4.40.0
  - accelerate>=0.27.0
  - peft
  - tiktoken
  - einops
  - sentencepiece
  - protobuf
  - huggingface_hub
  - datasets
  - fire
  - pysocks
  
  # --- DATA & AUDIO (Conda Versions) ---
  - pandas
  - scipy
  - pysoundfile            # <--- CHANGED: Correct Conda name for soundfile
  - librosa
  - scikit-learn
  - matplotlib
  - tensorboard
  - omegaconf
  - tqdm
  - pyyaml
  - psutil
  - joblib

  # --- PIP FALLBACK ---
  - pip
  - pip:
    - numpy<2              # Fixes the NumPy crash
    - bitsandbytes         # MUST be here (Not available in Conda)