name: flamingo
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # --- THE ENGINE (GPU Safe) ---
  - python=3.10
  - pytorch==2.1.2
  - torchvision==0.16.2
  - torchaudio==2.1.2
  - pytorch-cuda=11.8
  - ffmpeg

  # --- AI TOOLS ---
  - accelerate>=0.27.0
  - peft
  - tiktoken
  - einops
  - sentencepiece
  - protobuf
  - huggingface_hub
  - datasets
  - fire
  - pysocks

  # --- DATA & AUDIO ---
  - pandas
  - scipy
  - pysoundfile
  - scikit-learn
  - matplotlib
  - tensorboard
  - omegaconf
  - tqdm
  - pyyaml
  - psutil
  - joblib

  # --- PIP FALLBACK ---
  - pip
  - pip:
    - numpy<2
    - bitsandbytes
    - python-dotenv
    - transformers>=5.0.0      # AF3 needs >= 5.0, so pip not conda