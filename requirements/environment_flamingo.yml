name: flamingo
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # --- THE ENGINE (GPU Safe) ---
  - python=3.10
  - pytorch=2.5.1
  - torchvision
  - torchaudio
  - pytorch-cuda=12.4
  - ffmpeg

  # --- AI TOOLS ---
  - accelerate>=0.27.0
  - peft
  - tiktoken
  - einops
  - sentencepiece
  - protobuf<5              # pin: protobuf 29+ triggers abseil ABI mismatch with pyarrow
  - abseil-cpp              # pin: must match what pyarrow was compiled against
  - pyarrow<16              # pin: pyarrow>=16 links against incompatible abseil/protobuf
  - fsspec<=2023.10.0       # pin: newer fsspec can break datasets compatibility
  - huggingface_hub
  - datasets
  - fire
  - pysocks

  # --- DATA & AUDIO ---
  - pandas
  - numpy<2                 # pin: numpy 2.x breaks many audio/ML packages
  - pillow>=9.1.0           # pin: PIL.Image.Resampling added in 9.1.0; required by transformers>=5.0
  - scipy
  - pysoundfile
  - librosa
  - scikit-learn
  - matplotlib
  - tensorboard
  - omegaconf
  - tqdm
  - pyyaml
  - psutil
  - joblib

  # --- PIP FALLBACK ---
  - pip
  - pip:
    - numpy<2
    - bitsandbytes
    - python-dotenv
    - transformers>=5.0.0      # AF3 needs >= 5.0, so pip not conda